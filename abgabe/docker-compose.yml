# ─────────────────────────────────────────────────────────────────────────────
#  docker-compose.yml — Komfort-Wrapper um den Container-Start
# ─────────────────────────────────────────────────────────────────────────────
#
#  Statt mehrerer "docker run ... -v ... -p ... -e ..."-Befehle reicht hier:
#    docker compose up -d --build
#
#  Was passiert dabei?
#    1. Image aus dem Dockerfile bauen (oder vorhandenes Image nehmen)
#    2. Container starten, dass er auch nach Reboot automatisch hochkommt
#    3. Den Host-Netzwerkstack mitbenutzen (Linux-only)
#    4. profile.js vom Host einbinden (gerätespezifische Config bleibt außen)
# ─────────────────────────────────────────────────────────────────────────────

services:
  magicmirror:
    build: .                      # Dockerfile im aktuellen Verzeichnis
    image: magicmirror:latest     # Name fürs gebaute Image
    restart: unless-stopped       # Auto-Restart bei Crash oder Reboot

    # network_mode: host bedeutet, der Container hat KEINEN eigenen Netzwerk-
    # Namespace, sondern teilt sich den des Pi. Vorteile:
    #   - Chromium (außerhalb des Containers) erreicht den Server über
    #     localhost:8081, ohne dass wir Ports mappen müssen.
    #   - Der MQTT-Broker auf dem Host ist vom Container aus auch unter
    #     "localhost" erreichbar.
    #   - Der ipWhitelist-Schutz von MagicMirror ("127.0.0.1") greift.
    # Nachteil: nur unter Linux verfügbar — auf Mac/Windows klappt das so nicht.
    network_mode: host

    volumes:
      # profile.js ist gerätespezifisch (Standort, Nutzungstyp, API-Keys).
      # Wir mounten sie read-only von der Pi-Festplatte rein, statt sie ins
      # Image zu kopieren. So bleibt das Image gerätesneutral.
      - ./config/profile.js:/opt/magicmirror/config/profile.js:ro

    environment:
      # Zeitzone fest setzen, damit die Uhr-Anzeige im Spiegel stimmt
      - TZ=Europe/Berlin
